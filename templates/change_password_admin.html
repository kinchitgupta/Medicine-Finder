<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Change Password</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1e40af;--navy-d:#1e3a8a;--blue:#3b82f6;--sky:#38bdf8;
  --mint:#4ecf8e;--mint-l:#e8f7f0;
  --bg-grad-a:#e0f2fe;--bg-grad-b:#f0fdf4;
  --surface:#f0f6ff;--surface-2:#ffffff;
  --border-l:#bae6fd;
  --text-h:#1e3a8a;--text-m:#64748b;--text-faint:#94a3b8;
  --red:#dc2626;--green:#16a34a;
  --r-sm:10px;--r-md:16px;--r-lg:24px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,var(--bg-grad-a) 0%,var(--bg-grad-b) 100%);
  font-family:'Nunito',sans-serif;
  display:flex;flex-direction:column;
}

/* ── NAVBAR ─────────────────────── */
.navbar{
  background:var(--navy);padding:0 2.5rem;height:60px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--blue);
  position:sticky;top:0;z-index:100;
  animation:fadeDown .4s ease both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.navbar-brand{
  font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:700;
  color:var(--sky);letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 10px rgba(78,207,142,.7);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,207,142,.5)}70%{box-shadow:0 0 0 8px rgba(78,207,142,0)}}
.navbar-links{display:flex;align-items:center;gap:4px;}
.navbar-links a{
  text-decoration:none;font-size:.78rem;font-weight:600;
  color:#93c5fd;padding:6px 14px;border-radius:50px;
  letter-spacing:.02em;text-transform:uppercase;
  transition:background .2s,color .2s;
}
.navbar-links a:hover{background:rgba(255,255,255,.1);color:#fff;}
.navbar-links a.active{background:rgba(56,189,248,.2);color:var(--sky);}
.navbar-links a.logout{
  background:rgba(78,207,142,.15);color:#6ee7b7;
  border:1px solid rgba(78,207,142,.3);
}
.navbar-links a.logout:hover{background:rgba(78,207,142,.25);color:#fff;}

/* ── PAGE ───────────────────────── */
.page{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:3rem 1.5rem;
}

/* ── CARD ───────────────────────── */
.card{
  width:100%;max-width:460px;
  background:var(--surface-2);
  border-radius:var(--r-lg);
  border:1px solid var(--border-l);
  box-shadow:0 32px 80px rgba(30,64,175,.1),0 4px 20px rgba(30,64,175,.06);
  overflow:hidden;
  animation:rise .5s cubic-bezier(.16,1,.3,1) .1s both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── CARD HEADER ────────────────── */
.card-head{
  background:linear-gradient(135deg,var(--navy-d) 0%,#1e40af 100%);
  padding:2rem 2rem 1.5rem;
  text-align:center;
  position:relative;overflow:hidden;
}
.card-head::after{
  content:'';position:absolute;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.04);
  right:-60px;top:-60px;
}
.lock-icon{
  width:60px;height:60px;border-radius:18px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;margin:0 auto 1rem;
}
.card-head h2{
  font-family:'Outfit',sans-serif;
  font-size:1.5rem;font-weight:700;
  color:#fff;letter-spacing:-.01em;
}
.card-head p{font-size:.78rem;color:#93c5fd;margin-top:4px;}

/* ── FORM ───────────────────────── */
.form-area{padding:2rem;}

.field{display:flex;flex-direction:column;margin-bottom:1.1rem;}
.field label{
  font-family:'Outfit',sans-serif;
  font-size:.7rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-m);margin-bottom:5px;transition:color .2s;
}
.field:focus-within label{color:#2563eb;}
.field-inner{
  position:relative;display:flex;align-items:center;
}
.field-inner .icon{
  position:absolute;left:12px;font-size:1rem;
  pointer-events:none;opacity:.5;
}
.field input{
  width:100%;
  border:1.5px solid #e2e8f0;border-radius:var(--r-sm);
  background:var(--surface);
  padding:11px 14px 11px 38px;
  font-size:.9rem;font-family:'Nunito',sans-serif;
  color:var(--text-h);font-weight:500;outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.field input:focus{
  border-color:#3b82f6;background:#fff;
  box-shadow:0 0 0 3px rgba(59,130,246,.12);
}
.field input::placeholder{color:var(--text-faint);font-weight:400;}
.field .err{font-size:.7rem;font-weight:600;color:var(--red);min-height:14px;margin-top:3px;}

/* strength meter */
.strength-bar{height:3px;border-radius:99px;background:#e2e8f0;margin-top:6px;overflow:hidden;}
.strength-fill{height:100%;width:0;border-radius:99px;transition:width .3s,background .3s;}

.btn-submit{
  width:100%;
  background:var(--navy);color:#fff;
  border:none;border-radius:var(--r-sm);
  padding:13px;font-size:.9rem;font-weight:700;
  font-family:'Outfit',sans-serif;
  letter-spacing:.02em;cursor:pointer;
  box-shadow:0 4px 16px rgba(30,64,175,.28);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  margin-top:.5rem;
}
.btn-submit:hover{background:#1d4ed8;transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,78,216,.35);}
.btn-submit:active{transform:translateY(0);}

.back-link{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:1.25rem;
  text-decoration:none;font-size:.8rem;font-weight:600;
  color:var(--text-m);transition:color .2s;
}
.back-link:hover{color:var(--navy);}

.msg-box{
  margin:1rem 2rem 2rem;
  padding:12px 16px;border-radius:var(--r-sm);
  font-size:.82rem;font-weight:500;
  animation:popIn .25s ease-out;
}
@keyframes popIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg-success{background:#dcfce7;border:1px solid #bbf7d0;color:#16a34a;}
.msg-error{background:#fee2e2;border:1px solid #fecaca;color:var(--red);}
</style>

<script>
function checkStrength(val){
  const bar=document.getElementById('sbar');
  const fill=document.getElementById('sfill');
  if(!bar)return;
  let s=0;
  if(val.length>=6)s++;
  if(val.length>=10)s++;
  if(/[A-Z]/.test(val))s++;
  if(/[0-9]/.test(val))s++;
  if(/[^A-Za-z0-9]/.test(val))s++;
  const pct=Math.min(s*20,100)+'%';
  const color=s<=1?'#ef4444':s<=3?'#f59e0b':'#22c55e';
  fill.style.width=pct;fill.style.background=color;
}
function validateForm(){
  let ok=true;
  ['e1','e2','e3'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent='';});
  const v=id=>document.getElementById(id).value;
  const err=(id,msg)=>{const e=document.getElementById(id);if(e)e.textContent=msg;ok=false;};
  if(v('t1').length<1) err('e1','Old password is required');
  if(v('t2').length<6) err('e2','New password must be at least 6 characters');
  if(v('t2')!==v('t3')) err('e3','Passwords do not match');
  return ok;
}
</script>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand"><div class="brand-dot"></div>✦ Admin Portal</div>
  <div class="navbar-links">
    <a href="admin_home">Home</a>
    <a href="adminreg">Admin Reg</a>
    <a href="medicalreg">Medical Reg</a>
    <a href="show_medicaldata">Medical Data</a>
    <a href="logout" class="logout">⎋ Logout</a>
  </div>
</nav>

<div class="page">
<div class="card">

  <div class="card-head">
    <div class="lock-icon">🔐</div>
    <h2>Change Password</h2>
    <p>Update your admin account password securely</p>
  </div>

  <div class="form-area">
    <form method="POST" action="change_password_admin" onsubmit="return validateForm()">

      <div class="field">
        <label for="t1">Old Password</label>
        <div class="field-inner">
          <span class="icon">🔑</span>
          <input type="password" id="t1" name="T1" placeholder="Enter current password">
        </div>
        <span class="err" id="e1"></span>
      </div>

      <div class="field">
        <label for="t2">New Password</label>
        <div class="field-inner">
          <span class="icon">🔒</span>
          <input type="password" id="t2" name="T2" placeholder="Create new password"
            oninput="checkStrength(this.value)">
        </div>
        <div class="strength-bar" id="sbar"><div class="strength-fill" id="sfill"></div></div>
        <span class="err" id="e2"></span>
      </div>

      <div class="field">
        <label for="t3">Confirm New Password</label>
        <div class="field-inner">
          <span class="icon">✅</span>
          <input type="password" id="t3" name="T3" placeholder="Repeat new password">
        </div>
        <span class="err" id="e3"></span>
      </div>

      <button type="submit" class="btn-submit">Update Password →</button>

    </form>
    <a href="admin_home" class="back-link">← Return to Home</a>
  </div>

  {% if msg %}
  <div class="msg-box msg-success">✅ {{ msg }}</div>
  {% endif %}

</div>
</div>
</body>
</html>
