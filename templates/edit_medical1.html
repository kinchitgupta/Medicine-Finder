<!DOCTYPE html>
<html lang="en">
<head>
<title>Data Saved Successfully</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #edf2f7;
  --surface:   #d6e2ef;
  --card:      #c9d9ea;
  --border:    #aec4d9;
  --accent:    #1d4ed8;
  --accent2:   #3b82f6;
  --text:      #0f1e2e;
  --text2:     #1e3a52;
  --navy:      #0f2137;
  --sky:       #93c5fd;
  --r:         10px;
  --rL:        16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background: var(--bg);
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

/* ── STATUS CARD CONTAINER ── */
.status-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--rL);
  padding: 2.5rem 2rem;
  text-align: center;
  max-width: 440px;
  width: 100%;
  box-shadow: 0 4px 20px rgba(15, 33, 55, 0.05);
}

.status-card h1 {
  font-size: 1.45rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.02em;
  margin-bottom: 1.25rem;
}

/* ── SUCCESS LEDGER MESSAGE ── */
.msg-box {
  background: var(--surface);
  border-left: 4px solid var(--accent2);
  border-radius: var(--r);
  padding: 14px 16px;
  font-size: .88rem;
  color: var(--text2);
  font-weight: 600;
  text-align: left;
  line-height: 1.5;
  margin-bottom: 2rem;
}

/* ── FORM BUTTON ACTION ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: .8rem;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: var(--r);
  width: 100%;
  transition: all .18s;
  cursor: pointer;
  border: none;
  font-family: inherit;
  text-transform: uppercase;
  letter-spacing: .05em;
  background: var(--navy);
  color: var(--sky);
}

.btn:hover {
  background: var(--text);
  color: #ffffff;
  transform: translateY(-1px);
}
</style>
</head>
<body>

{% if msg %}
<div class="status-card">
  <h1>Registry Updated</h1>
  <div class="msg-box">
    💾 {{ msg }}
  </div>
  <a href="/show_medicaldata" style="text-decoration: none; display: block; width: 100%;">
    <button class="btn">Commit &amp; Continue</button>
  </a>
</div>
{% endif %}

</body>
</html>
